name: CI Pipeline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: install backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: run frontend test
        working-directory: ./frontend
        run: npm run test

      - name: run backend test
        working-directory: ./backend
        run: npm run test:cov -- --forceExit --ci

      - name: build frontend
        working-directory: ./frontend
        run: npm run build

      - name: build backend 
        working-directory: ./backend
        run: npm run build   

      - name: Docker hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Docker image
        uses: docker/build-push-action@v5
        with: 
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/blog-frontend:latest
          build-args: |
            VITE_API_URL=https://api.sudipkhadka26.com.np/api/v1
              
      - name: Build and Push backend Docker image
        uses: docker/build-push-action@v5
        with: 
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/blog-backend:latest